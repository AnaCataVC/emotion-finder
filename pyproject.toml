[project]
name = "emotion-finder"
version = "1.7.0"
description = "Bilingual Affective NLP Classifier & Somatic Decision Tree based on Russell's Circumplex Model of Affect"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "data/archive",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F403", "F405"]
